<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول العملات - KNOW IT</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <style>
        .converter-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 35px;
            margin-top: 40px;
            border: 1px solid #e2e8f0;
        }

        .result-box {
            background: linear-gradient(135deg, #0d6efd 0%, #00d2ff 100%);
            color: #ffffff;
            border-radius: 14px;
            padding: 20px;
            font-weight: bold;
        }

        .currency-select, .amount-input {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            font-size: 1.05rem;
        }

        .currency-select:focus, .amount-input:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
            border-color: #0d6efd;
        }

        .swap-btn {
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            transition: transform 0.3s ease;
        }

        .swap-btn:hover {
            transform: rotate(180deg);
        }
    </style>
</head>

<body>
    <!-- Navbar Header -->
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-primary" href="index.html">KNOW IT</a>
                <a href="index.html" class="btn btn-outline-primary btn-sm">← العودة للرئيسية</a>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="converter-card">
                    <h2 class="text-center mb-4 fw-bold text-primary">💱 محول العملات المباشر</h2>
                    <form id="currency-form" onsubmit="return false;">
                        <div class="row g-3 align-items-center">
                            
                            <div class="col-md-5">
                                <label for="from-currency" class="form-label fw-bold text-secondary">من (From)</label>
                                <select id="from-currency" class="form-select currency-select">
                                    <option value="USD" selected>USD - دولار أمريكي</option>
                                    <option value="EGP">EGP - جنيه مصري</option>
                                    <option value="SAR">SAR - ريال سعودي</option>
                                    <option value="EUR">EUR - يورو أوروبي</option>
                                    <option value="AED">AED - درهم إماراتي</option>
                                    <option value="GBP">GBP - جنيه إسترليني</option>
                                    <option value="KWD">KWD - دينار كويتي</option>
                                    <option value="QAR">QAR - ريال قطري</option>
                                    <option value="JPY">JPY - ين ياباني</option>
                                    <option value="CAD">CAD - دولار كندي</option>
                                </select>
                            </div>

                            <div class="col-md-2 text-center my-2 my-md-0">
                                <button type="button" class="btn btn-light border swap-btn shadow-sm" id="swap-currencies" title="تبديل العملتين">
                                    🔄
                                </button>
                            </div>

                            <div class="col-md-5">
                                <label for="to-currency" class="form-label fw-bold text-secondary">إلى (To)</label>
                                <select id="to-currency" class="form-select currency-select">
                                    <option value="USD">USD - دولار أمريكي</option>
                                    <option value="EGP" selected>EGP - جنيه مصري</option>
                                    <option value="SAR">SAR - ريال سعودي</option>
                                    <option value="EUR">EUR - يورو أوروبي</option>
                                    <option value="AED">AED - درهم إماراتي</option>
                                    <option value="GBP">GBP - جنيه إسترليني</option>
                                    <option value="KWD">KWD - دينار كويتي</option>
                                    <option value="QAR">QAR - ريال قطري</option>
                                    <option value="JPY">JPY - ين ياباني</option>
                                    <option value="CAD">CAD - دولار كندي</option>
                                </select>
                            </div>

                            <div class="col-12 mt-4">
                                <label for="amount" class="form-label fw-bold text-secondary">المبلغ (Amount)</label>
                                <input type="number" id="amount" class="form-control amount-input" value="1" min="0" step="any" placeholder="أدخل المبلغ هنا...">
                            </div>

                            <div class="col-12 mt-4">
                                <label class="form-label fw-bold text-secondary">النتيجة (Result)</label>
                                <div class="result-box text-center shadow-sm" id="result-container">
                                    <span id="loading-spinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
                                    <h3 class="m-0 fw-bold" id="result-text">1 USD = -- EGP</h3>
                                </div>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-5 bg-dark text-white py-3 text-center">
        <p class="m-0">جميع الحقوق محفوظة لـ Know IT © 2026</p>
    </footer>

    <!-- Bootstrap JS & Convert Logic JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/convert.js"></script>
</body>

</html>
